<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BN CHAIN - Quản Trị Vận Tải</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <link rel="stylesheet" href="style.css">
  <!-- Supabase SDK — chỉ 1 lần duy nhất -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<!-- ========== LOGIN ========== -->
<div id="login-page">
  <div class="login-wrap">
    <div class="login-card">
      <div class="login-brand"><div class="b"><span>BN</span> CHAIN</div><div class="s">LOGISTICS & SOLUTIONS</div></div>
      <div class="form-group"><label>Email</label><input type="email" id="li-email" placeholder="email@bnchain.vn" onkeydown="if(event.key==='Enter')doLogin()"></div>
      <div class="form-group"><label>Mật khẩu</label><input type="password" id="li-pass" placeholder="••••••" onkeydown="if(event.key==='Enter')doLogin()"></div>
      <button class="btn btn-primary" style="width:100%;justify-content:center" onclick="doLogin()"><i class="ti ti-login"></i> Đăng nhập</button>
    </div>
  </div>
</div>

<!-- ========== APP ========== -->
<div id="app-page" style="display:none" class="app">
  <!-- SIDEBAR -->
  <div class="sidebar">
    <div class="sidebar-brand" onclick="nav('orders',this)">
      <div class="brand-logo"><span>BN</span> CHAIN</div>
      <div class="brand-sub">LOGISTICS & SOLUTIONS</div>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-section">VẬN HÀNH</div>
      <div class="nav-item active" onclick="nav('orders',this)"><i class="ti ti-list-details"></i>Quản lý vận đơn</div>
      <div class="nav-item" onclick="nav('dieuvan',this)"><i class="ti ti-map-route"></i>Bảng điều vận</div>
      <div class="nav-item" onclick="nav('chiho',this)"><i class="ti ti-receipt"></i>Chi hộ / Phát sinh</div>
      <div class="nav-item" onclick="nav('hoadon',this)"><i class="ti ti-scan"></i>Upload Hóa Đơn</div>
      <div class="nav-item" onclick="nav('congno',this)"><i class="ti ti-credit-card"></i>Công nợ</div>
      <div class="nav-section">KẾ TOÁN</div>
      <div class="nav-item" onclick="nav('bangke',this)"><i class="ti ti-file-invoice"></i>Bảng kê thu khách</div>
      <div class="nav-item" onclick="nav('traphau',this)"><i class="ti ti-truck-delivery"></i>Trả thầu phụ</div>
      <div class="nav-item" onclick="nav('baocao',this)"><i class="ti ti-chart-bar"></i>Báo cáo tháng</div>
      <div class="nav-section">DANH MỤC</div>
      <div class="nav-item" onclick="nav('kh',this)"><i class="ti ti-building"></i>Khách hàng</div>
      <div class="nav-item" onclick="nav('xe',this)"><i class="ti ti-truck"></i>Phương tiện & Lái xe</div>
      <div class="nav-item" onclick="nav('nv',this)"><i class="ti ti-user-circle"></i>Nhân viên</div>
    </nav>
    <div class="sidebar-footer">
      <div class="user-info">
        <div class="user-name" id="user-name">—</div>
        <div class="user-role" id="user-role">—</div>
      </div>
      <button class="btn btn-sm" onclick="doLogout()"><i class="ti ti-logout"></i> Đăng xuất</button>
    </div>
  </div>

  <!-- MAIN -->
  <div class="main">
    <div class="topbar">
      <h2 class="page-title" id="page-title">Quản lý vận đơn</h2>
      <div style="display:flex;align-items:center;gap:10px">
        <span class="role-badge" id="role-badge">CEO</span>
        <span style="font-size:12px;color:var(--text-muted)" id="topbar-date"></span>
      </div>
    </div>
    <div class="content" id="content"></div>
  </div>

  <!-- DETAIL PANEL -->
  <div class="dp" id="dp" style="display:none">
    <div class="dp-head">
      <span id="dp-title" class="fw6"></span>
      <div style="display:flex;gap:6px;align-items:center">
        <span id="dp-lock-badge"></span>
        <button class="btn btn-sm" onclick="closeDp()"><i class="ti ti-x"></i></button>
      </div>
    </div>
    <div class="dp-tabs" id="dp-tabs"></div>
    <div class="dp-body" id="dp-body"></div>
  </div>
</div>

<!-- ========== JS MODULES (thứ tự load quan trọng) ========== -->
<script src="js/config.js"></script>   <!-- 1. Globals, Supabase client, Auth, Utils -->
<script src="js/orders.js"></script>   <!-- 2. Vận đơn, Chi hộ, Detail panel -->
<script src="js/pages.js"></script>    <!-- 3. Bảng kê, Báo cáo, Điều vận, Công nợ -->
<script src="js/hoadon.js"></script>   <!-- 4. Upload HĐ, AI Scan -->
<script src="js/danhmuc.js"></script>  <!-- 5. Khách hàng, Phương tiện, Nhân viên -->

</body>
</html>
