<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>BN CHAIN — Xem bảng kê</title>
<style>
:root{--primary:#E8820C;--teal:#3d7a8a;--teal-dark:#2d5f6d;--text:#1a2a30;--text-muted:#5a7a85;--border:#dde8eb;--bg:#f0f5f7;--white:#fff;--success:#16a34a;--danger:#dc2626;--r:8px}
*{box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,sans-serif;font-size:13px;background:var(--bg);color:var(--text);margin:0;padding:16px}
.wrap{max-width:900px;margin:0 auto}
.brand{text-align:center;margin-bottom:16px}
.brand .b{font-size:22px;font-weight:700;color:var(--teal)}
.brand .b span{color:var(--primary)}
.brand .s{font-size:10px;color:var(--text-muted);letter-spacing:1px;margin-top:2px}
.card{background:var(--white);border:1px solid var(--border);border-radius:var(--r);padding:16px;margin-bottom:14px}
.hd{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:4px}
.hd h2{margin:0;font-size:16px}
.hd .muted{font-size:11px;color:var(--text-muted)}
.total{background:linear-gradient(135deg,#1a2f38,var(--teal-dark));border-radius:var(--r);padding:14px 16px;color:#fff;text-align:center;margin-bottom:14px}
.total .lbl{font-size:11px;opacity:.8;text-transform:uppercase;letter-spacing:.5px}
.total .val{font-size:24px;font-weight:700;margin-top:2px}
table{width:100%;border-collapse:collapse;font-size:12px}
th{padding:7px 8px;text-align:left;font-size:10px;font-weight:600;color:var(--text-muted);border-bottom:1px solid var(--border);text-transform:uppercase;letter-spacing:.3px;white-space:nowrap}
td{padding:7px 8px;border-bottom:1px solid var(--border);white-space:nowrap}
tfoot td{font-weight:700;background:var(--bg)}
.tbl-wrap{overflow-x:auto}
.right{text-align:right}
.tag{font-size:10px;padding:2px 7px;border-radius:20px;font-weight:600;white-space:nowrap}
.loading,.error,.empty{text-align:center;padding:40px 20px;color:var(--text-muted)}
.error{color:var(--danger)}
.spin{display:inline-block;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.foot-note{text-align:center;font-size:10.5px;color:var(--text-muted);margin-top:10px}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <div class="b">BN <span>CHAIN</span></div>
    <div class="s">LOGISTICS &amp; SOLUTIONS</div>
  </div>
  <div id="content"><div class="card"><div class="loading">⏳ Đang tải bảng kê...</div></div></div>
</div>

<script>
const API_URL='/api/xembang';

function fmt(n){return (Math.round(+n||0)).toLocaleString('vi-VN')+' đ';}
function fmtDate(s){if(!s)return '—';const[y,m,d]=String(s).split('-');return d&&m&&y?`${d}/${m}/${y}`:s;}
function lcTag(lc){
  if(!lc)return '—';
  const bg={'Thường':'#f0fdf4','Kết hợp':'#eff6ff','Kẹp ghép':'#fef9c3'};
  const co={'Thường':'#166534','Kết hợp':'#1d4ed8','Kẹp ghép':'#854d0e'};
  return `<span class="tag" style="background:${bg[lc]||'#e2e8f0'};color:${co[lc]||'#334155'}">${lc}</span>`;
}
function thangCua(ngay){return (ngay||'').slice(0,7);} // 'YYYY-MM'
function tenThang(ym){const[y,m]=ym.split('-');return `Tháng ${+m}/${y}`;}
let CUR_DATA=null;
let CUR_THANGS=null;
function onChonThang(){
  const ym=document.getElementById('sel-thang').value;
  render(CUR_DATA,ym,CUR_THANGS);
}

async function load(){
  const el=document.getElementById('content');
  const params=new URLSearchParams(location.search);
  const token=(params.get('token')||'').trim();
  if(!token){
    el.innerHTML='<div class="card"><div class="error">⚠️ Link không hợp lệ — thiếu mã truy cập.</div></div>';
    return;
  }
  try{
    const r=await fetch(`${API_URL}?token=${encodeURIComponent(token)}`);
    const data=await r.json();
    if(!r.ok){
      el.innerHTML=`<div class="card"><div class="error">⚠️ ${data.error||'Không tải được dữ liệu'}</div></div>`;
      return;
    }
    CUR_DATA=data;
    const thangs=[...new Set(data.rows.map(r=>thangCua(r.ngay)))];
    const thangNay=new Date().toISOString().slice(0,7); // 'YYYY-MM' theo lịch thực tế
    if(!thangs.includes(thangNay))thangs.push(thangNay); // luôn có tháng hiện tại trong lựa chọn dù chưa có chuyến
    thangs.sort().reverse();
    CUR_THANGS=thangs;
    render(data,thangNay,thangs);
  }catch(err){
    el.innerHTML=`<div class="card"><div class="error">⚠️ Lỗi kết nối: ${err.message}</div></div>`;
  }
}

function render(data,ymChon,thangs){
  const el=document.getElementById('content');
  thangs=thangs||[...new Set(data.rows.map(r=>thangCua(r.ngay)))].sort().reverse();
  const rows=[...data.rows]
    .filter(r=>!ymChon||thangCua(r.ngay)===ymChon)
    .sort((a,b)=>(b.ngay||'').localeCompare(a.ngay||''));
  const tongThang=rows.reduce((s,r)=>s+(r.tong||0),0);
  const selectHtml=`<select id="sel-thang" onchange="onChonThang()" style="padding:6px 10px;border:1px solid var(--border);border-radius:var(--r);font-size:12px;background:var(--white)">
    ${thangs.map(t=>`<option value="${t}" ${t===ymChon?'selected':''}>${tenThang(t)}</option>`).join('')}
  </select>`;
  if(data.loai==='thau'){
    document.title=`Bảng kê — ${data.ten}`;
    el.innerHTML=`
    <div class="card">
      <div class="hd"><h2>📋 Bảng kê trả thầu — ${data.ten}</h2>${selectHtml}</div>
      <div class="hd"><span class="muted">${rows.length} chuyến đã khóa trong ${ymChon?tenThang(ymChon):'3 tháng gần nhất'}</span></div>
    </div>
    <div class="total"><div class="lbl">Tổng phải trả — ${ymChon?tenThang(ymChon):'3 tháng gần nhất'}</div><div class="val">${fmt(tongThang)}</div></div>
    <div class="card">
      ${!rows.length?'<div class="empty">Không có chuyến nào trong tháng này</div>':`
      <div class="tbl-wrap"><table>
        <thead><tr><th>Ngày</th><th>Mã đơn</th><th>Tuyến đường</th><th>Cont</th><th>Loại</th><th>BKS</th>
          <th class="right">Cước thầu</th><th class="right">Phát sinh</th><th class="right">Trừ lương LX</th><th class="right">Tổng</th></tr></thead>
        <tbody>${rows.map(r=>`<tr>
          <td>${fmtDate(r.ngay)}</td><td>${r.ma_don}</td><td>${r.hanh_trinh}</td>
          <td>${r.so_cont||'—'}<br><span class="muted" style="font-size:10px">${r.loai_cont||''}</span></td>
          <td>${lcTag(r.loai_chuyen)}</td><td>${r.bien_kiem_soat||'—'}</td>
          <td class="right">${fmt(r.gia_cuoc_thau)}</td>
          <td class="right">${(r.tra_them+r.doi_lenh)?fmt(r.tra_them+r.doi_lenh):'—'}</td>
          <td class="right">${r.tru_luong_lx?'-'+fmt(r.tru_luong_lx):'—'}</td>
          <td class="right" style="font-weight:600">${fmt(r.tong)}</td>
        </tr>`).join('')}</tbody>
        <tfoot><tr><td colspan="9">Tổng cộng</td><td class="right">${fmt(tongThang)}</td></tr></tfoot>
      </table></div>`}
    </div>
    <div class="foot-note">Dữ liệu chỉ gồm các chuyến đã chốt (khóa sổ), tối đa trong 3 tháng gần nhất. Có thắc mắc, vui lòng liên hệ điều vận/kế toán BN Chain.</div>`;
  }else{
    document.title=`Bảng lương — ${data.ten}`;
    el.innerHTML=`
    <div class="card">
      <div class="hd"><h2>💰 Bảng lương lái xe — ${data.ten}</h2>${selectHtml}</div>
      <div class="hd"><span class="muted">${rows.length} chuyến đã khóa trong ${ymChon?tenThang(ymChon):'3 tháng gần nhất'}</span></div>
    </div>
    <div class="total"><div class="lbl">Tổng lương — ${ymChon?tenThang(ymChon):'3 tháng gần nhất'}</div><div class="val">${fmt(tongThang)}</div></div>
    <div class="card">
      ${!rows.length?'<div class="empty">Không có chuyến nào trong tháng này</div>':`
      <div class="tbl-wrap"><table>
        <thead><tr><th>Ngày</th><th>Mã đơn</th><th>BKS</th><th>Tuyến đường</th><th>Loại</th>
          <th class="right">Lương chuyến</th><th class="right">Chi hộ trả LX</th><th class="right">Tổng</th></tr></thead>
        <tbody>${rows.map(r=>`<tr>
          <td>${fmtDate(r.ngay)}</td><td>${r.ma_don}</td><td>${r.bien_kiem_soat||'—'}</td><td>${r.hanh_trinh}</td>
          <td>${lcTag(r.loai_chuyen)}</td>
          <td class="right">${r.khong_trucking?'<span style="font-size:10px;color:var(--teal)">KHÔNG TRUCKING</span>':fmt(r.luong_chuyen)}</td>
          <td class="right">${r.tra_lx?fmt(r.tra_lx):'—'}</td>
          <td class="right" style="font-weight:600">${fmt(r.tong)}</td>
        </tr>`).join('')}</tbody>
        <tfoot><tr><td colspan="7">Tổng cộng</td><td class="right">${fmt(tongThang)}</td></tr></tfoot>
      </table></div>`}
    </div>
    <div class="foot-note">Dữ liệu chỉ gồm các chuyến đã chốt (khóa sổ), tối đa trong 3 tháng gần nhất. Có thắc mắc, vui lòng liên hệ điều vận/kế toán BN Chain.</div>`;
  }
}

load();
</script>
</body>
</html>
